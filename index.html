<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시장 신호반 · Market Signal Panel</title>
<meta name="description" content="나스닥 · 비트코인 · 리플 · 금 · 달러 · 엔화 데일리 매수/매도 신호판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --bg-grain: radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0);
    --panel:#1d2124;
    --panel-hi:#232830;
    --border:#2c3236;
    --border-lo:#25292d;
    --brass:#c9a24d;
    --brass-dim:#8a7238;
    --ink:#eae6da;
    --ink-dim:#9299a0;
    --ink-faint:#5b6167;
    --buy:#3ddc84;
    --sell:#ff5c54;
    --hold:#ffb648;
    --off:#5b6167;
    --radius:8px;
    --font-ui:'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', 'Noto Sans Mono', monospace;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh;
    background:
      linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px),
      var(--bg-grain), var(--bg);
    background-size: auto, 3px 3px, auto;
    color:var(--ink); font-family:var(--font-ui);
    padding: 16px 12px 40px; line-height:1.4;
  }

  .wrap{max-width:620px; margin:0 auto;}

  /* ---------- 헤더: 2줄로 압축 ---------- */
  header.plate{
    border:1px solid var(--border); border-radius:var(--radius);
    background:linear-gradient(180deg, var(--panel-hi), var(--panel));
    padding:11px 14px; margin-bottom:9px;
  }
  .h1{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .brand{
    font-family:var(--font-mono); font-weight:600; letter-spacing:.09em;
    font-size:13px; color:var(--brass); text-transform:uppercase; white-space:nowrap;
  }
  .updated-wrap{display:flex; align-items:center; gap:7px; white-space:nowrap;}
  #updatedAt{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);}
  .refresh-btn{
    appearance:none; border:1px solid var(--border); background:var(--panel-hi);
    color:var(--ink-dim); border-radius:5px; width:22px; height:22px; line-height:1;
    font-size:12px; cursor:pointer; transition:.15s; flex:none;
  }
  .refresh-btn:hover{color:var(--brass); border-color:var(--brass-dim);}
  .refresh-btn:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}

  .h2{
    margin-top:7px; display:flex; gap:14px;
    font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);
  }
  .h2 b{font-weight:700;}
  .h2 .buy b{color:var(--buy);}
  .h2 .hold b{color:var(--hold);}
  .h2 .sell b{color:var(--sell);}

  /* ---------- 리스트: 자산당 2줄 ---------- */
  .list{display:flex; flex-direction:column; gap:6px;}

  .row{
    border:1px solid var(--border);
    border-left:3px solid var(--row-color, var(--off));
    border-radius:6px;
    background:linear-gradient(180deg, var(--panel-hi), var(--panel));
    padding:8px 12px 8px 11px;
    opacity:0; animation:slide-in .4s ease forwards;
  }
  @keyframes slide-in{
    from{opacity:0; transform:translateX(-3px);}
    to{opacity:1; transform:translateX(0);}
  }

  .row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .row-name{font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap;}
  .row-right{display:flex; align-items:center; gap:6px;}
  .row-badge{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim);
    border:1px solid var(--border-lo); border-radius:4px; padding:1px 6px; white-space:nowrap;
  }
  .row-signal{
    font-family:var(--font-mono); font-weight:700; font-size:11px;
    padding:2px 8px; border-radius:4px; white-space:nowrap;
  }

  .row-stats{display:flex; gap:16px; margin-top:4px; font-family:var(--font-mono); font-size:12px;}
  .row-stats .lbl{color:var(--ink-faint); font-size:9.5px; margin-right:3px;}
  .row-stats .val{color:var(--ink-dim);}
  .row-stats .val.neg{color:var(--sell);}

  .foot{
    margin-top:20px; padding-top:12px; border-top:1px solid var(--border-lo);
    font-size:11px; color:var(--ink-faint); text-align:center; line-height:1.7;
  }

  .err-banner{
    border:1px solid #5c2c2c; background:#241717; color:#ffb0ab;
    border-radius:var(--radius); padding:12px 14px; font-size:12.5px; margin-bottom:9px;
  }

  @media (max-width:360px){
    .row-name{font-size:13.5px;}
    .row-badge, .row-signal{font-size:10px;}
    .row-stats{gap:12px; font-size:11.5px;}
  }

  @media (prefers-reduced-motion: reduce){
    .row{animation:none; opacity:1;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="plate">
    <div class="h1">
      <span class="brand">Market Signal</span>
      <span class="updated-wrap">
        <span id="updatedAt">불러오는 중…</span>
        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="새로고침">↻</button>
      </span>
    </div>
    <div class="h2" id="summary"></div>
  </header>

  <div id="errArea"></div>
  <div class="list" id="list"></div>

  <div class="foot">
    참고용 신호일 뿐 자동 매매는 실행하지 않습니다 · 나스닥/코인 = Fear&nbsp;&amp;&nbsp;Greed 기준 · 금·달러·엔화 = 이동평균선 기준
  </div>
</div>

<script>
const ORDER = ['nasdaq','bitcoin','xrp','gold','usdkrw','jpykrw'];
const RATING_KR = {
  'extreme fear':'극단공포', 'fear':'공포', 'neutral':'중립',
  'greed':'탐욕', 'extreme greed':'극단탐욕'
};
const SIGNAL_META = {
  buy:  {color:'var(--buy)',  text:'매수',      chipBg:'rgba(61,220,132,.1)',  chipColor:'var(--buy)',  chipBorder:'rgba(61,220,132,.4)'},
  sell: {color:'var(--sell)', text:'매도(부분)', chipBg:'rgba(255,92,84,.1)',   chipColor:'var(--sell)', chipBorder:'rgba(255,92,84,.4)'},
  hold: {color:'var(--hold)', text:'관망',      chipBg:'rgba(255,182,72,.09)', chipColor:'var(--hold)', chipBorder:'rgba(255,182,72,.35)'},
  unknown:{color:'var(--off)', text:'오류',     chipBg:'transparent',          chipColor:'var(--ink-faint)', chipBorder:'var(--border)'}
};

function fmt(x, digits){
  if (x === null || x === undefined || Number.isNaN(x)) return '—';
  return Number(x).toLocaleString('ko-KR', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

function badgeText(key, a){
  if (a.driver === 'fear_greed'){
    if (a.fg_score == null) return '—';
    const ratingKr = RATING_KR[a.fg_rating] || a.fg_rating || '';
    return `${ratingKr} ${Math.round(a.fg_score)}`;
  }
  if (a.driver === 'moving_average'){
    if (a.price == null || !a.ma120) return '—';
    const vs = (a.price/a.ma120 - 1) * 100;
    return `120일 ${vs>=0?'+':''}${fmt(vs,1)}%`;
  }
  return '—';
}

function rowHTML(key, a){
  const meta = SIGNAL_META[a.signal] || SIGNAL_META.unknown;
  const price = a.price != null ? fmt(a.price,0) : '—';
  const high  = a.high_365d != null ? fmt(a.high_365d,0) : '—';
  const mdd   = a.mdd_pct != null ? fmt(a.mdd_pct,2)+'%' : '—';

  return `
    <div class="row" style="--row-color:${meta.color}">
      <div class="row-top">
        <span class="row-name">${a.name_kr}</span>
        <span class="row-right">
          <span class="row-badge">${badgeText(key,a)}</span>
          <span class="row-signal" style="background:${meta.chipBg}; color:${meta.chipColor}; border:1px solid ${meta.chipBorder}">${meta.text}</span>
        </span>
      </div>
      <div class="row-stats">
        <span><span class="lbl">현재</span><span class="val">${price}</span></span>
        <span><span class="lbl">365최고</span><span class="val">${high}</span></span>
        <span><span class="lbl">MDD</span><span class="val ${a.mdd_pct<0?'neg':''}">${mdd}</span></span>
      </div>
    </div>`;
}

function formatUpdated(iso){
  const d = new Date(iso);
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  let h = d.getHours();
  const ampm = h < 12 ? '오전' : '오후';
  h = h % 12; if (h === 0) h = 12;
  const min = String(d.getMinutes()).padStart(2,'0');
  return `갱신일 ${yy}.${mm}.${dd} ${ampm} ${h}:${min}`;
}

function render(data){
  const list = document.getElementById('list');
  const assets = data.assets || {};
  list.innerHTML = ORDER.filter(k => assets[k]).map(k => rowHTML(k, assets[k])).join('');
  [...list.children].forEach((el,i) => el.style.animationDelay = (i*55)+'ms');

  const counts = {buy:0, hold:0, sell:0};
  Object.values(assets).forEach(a => { if(counts[a.signal] !== undefined) counts[a.signal]++; });
  document.getElementById('summary').innerHTML = `
    <span class="buy">매수 <b>${counts.buy}</b></span>
    <span class="hold">관망 <b>${counts.hold}</b></span>
    <span class="sell">매도 <b>${counts.sell}</b></span>
  `;

  document.getElementById('updatedAt').textContent = data.updated_at ? formatUpdated(data.updated_at) : '';
  document.getElementById('errArea').innerHTML = '';
}

async function load(){
  document.getElementById('updatedAt').textContent = '불러오는 중…';
  try{
    const res = await fetch('./signals.json', {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  } catch(e){
    document.getElementById('errArea').innerHTML =
      `<div class="err-banner">signals.json을 불러오지 못했어요 (${e.message}). GitHub Pages 배포 후 확인해보세요.</div>`;
    document.getElementById('updatedAt').textContent = '';
  }
}

document.getElementById('refreshBtn').addEventListener('click', load);
load();
</script>
</body>
</html>
